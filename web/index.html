<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint</title>

<!-- The snapshot is the slowest thing the page waits for, so it is asked for
     before anything else: app.js picks this request up instead of making its
     own (`dataUrlFromQuery` and `loadInto` there).  Without it the request
     would wait for every script below to arrive and run. -->
<script>
  try {
    (function () {
      var url = new URLSearchParams(location.search).get('data') || './blueprint.json';
      var response = fetch(url, { cache: 'no-cache' });
      response.catch(function () { /* app.js reports it */ });
      window.blueprintSnapshot = { url: url, response: response };
    })();
  } catch (e) { /* app.js fetches it itself */ }
  // The module of the page on screen, which app.js imports only once it runs
  // (`PAGES` there); asking for it now lets it download beside app.js.
  try {
    (function () {
      var view = (location.hash.match(/^#\/([a-z]+)/) || [])[1];
      if (['object', 'document', 'progress', 'checks'].indexOf(view) < 0) view = 'graph';
      var link = document.createElement('link');
      link.rel = 'modulepreload';
      link.href = view + '.js';
      document.head.appendChild(link);
      // The graph's largest download is ELK's worker half, 430 kB: start the
      // worker now rather than once graph.js has arrived and run.  graph.js
      // takes it over (`earlyWorker` there) only if it imports graph.js's own
      // `ELK_WORKER`, which this URL must therefore be (a test checks).
      if (view === 'graph' && typeof Worker === 'function' && window.Blob && URL.createObjectURL) {
        var src = 'https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk-worker.min.js';
        var program = new Blob(['importScripts(' + JSON.stringify(src) + ');\n'], { type: 'text/javascript' });
        var early = { src: src, worker: new Worker(URL.createObjectURL(program)), failed: false };
        early.worker.onerror = function () { early.failed = true; };
        window.blueprintElkWorker = early;
      }
    })();
  } catch (e) { /* app.js imports it anyway; graph.js starts its own worker */ }
  // The intro, which `blueprint site` writes to intro.json beside the
  // snapshot, so that it can play while a large snapshot is still on its way
  // (`earlyIntro` in intro.js).  Only on the landing page, the bare graph,
  // and not with ?intro=0 (`wantsIntro`).  Until it is known, the page shows
  // nothing rather than the top bar the intro would then take away.
  try {
    (function () {
      var h = location.hash;
      if (new URLSearchParams(location.search).get('intro') === '0') return;
      if (!(h === '' || h === '#' || h === '#/' || h === '#/graph')) return;
      var root = document.documentElement;
      var base = window.blueprintSnapshot ? window.blueprintSnapshot.url : './blueprint.json';
      var url = new URL('intro.json', new URL(base, location.href)).href;
      root.classList.add('intro-pending');
      var intro = fetch(url, { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
      var shown = function () { root.classList.remove('intro-pending'); };
      intro.then(function (j) { if (!j || !j.intro) shown(); });
      setTimeout(shown, 4000); // whatever happens to the scripts below
      window.blueprintIntro = intro;
    })();
  } catch (e) { /* the intro plays once the snapshot is in */ }
</script>
<!-- What app.js imports, so it is not found only once app.js has arrived.
     Only a hint: a module missing here is still loaded, a little later. -->
<link rel="modulepreload" href="app.js">
<link rel="modulepreload" href="model.js">
<link rel="modulepreload" href="preview.js">
<link rel="modulepreload" href="pdf.js">
<link rel="modulepreload" href="export/sha256.js">
<link rel="modulepreload" href="intro.js">

<!-- Pinned CDN dependencies.  No build step: everything below is plain
     HTML/CSS/ES modules served statically.  ELK is not among them: only the
     graph needs it, and graph.js loads it when the graph is drawn. -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
      crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="style.css">

<script defer
        src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"
        integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer
        src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"
        integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer
        src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <a class="brand" href="#/graph">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text" id="project-title">Blueprint</span>
    </a>
    <nav class="tabs" id="tabs">
      <a href="#/graph"    data-view="graph">Graph</a>
      <a href="#/document" data-view="document">Document</a>
      <a href="#/progress" data-view="progress">Progress</a>
      <a href="#/checks"   data-view="checks">Checks</a>
    </nav>
  </div>
  <div class="gsearch" id="gsearch" role="search">
    <input type="search" id="gsearch-input" placeholder="Search the blueprint"
           aria-label="Search the blueprint (press / to focus)" autocomplete="off" spellcheck="false"
           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="gsearch-results">
    <kbd class="gsearch-key" aria-hidden="true">/</kbd>
    <div class="gsearch-panel" id="gsearch-panel" hidden>
      <div class="gsearch-results" id="gsearch-results" role="listbox" aria-label="Search results"></div>
      <div class="gsearch-foot" id="gsearch-foot"></div>
    </div>
  </div>
  <button type="button" class="export-pdf" id="export-pdf" disabled aria-haspopup="dialog"
          title="Export the blueprint, or the part you are reading, as a PDF">
    <svg class="export-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
      <path d="M4 1.5h5.5L13 5v9.5H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M8.5 7v5m-2-2 2 2 2-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Export PDF</span>
  </button>
  <div class="topbar-aside" id="topbar-aside"></div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="app" class="app">
  <div class="loading">Loading blueprint&hellip;</div>
</main>

<!-- async: app.js starts loading the page on screen while the scripts above
     are still arriving, and waits for them only before it draws. -->
<script type="module" async src="app.js"></script>
</body>
</html>
